name: Regenerate from the published OpenAPI document

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# contents: write is all this needs. It does NOT open a pull request: the
# organization refuses createPullRequest for GITHUB_TOKEN org-wide
# ("GitHub Actions is not permitted to create or approve pull requests"), so
# every run from 2026-09-14 on pushed a regenerate/* branch and then died at
# the PR step, leaving this client behind the API. scripts/generate.sh is the
# review: it fails the job on gofmt, go vet, go build, and the hand-maintained
# transport-policy checks, so nothing reaches main that does not compile and
# still carries the credential, deadline and stream guards. A release is still
# tagged by hand from main.
permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Regenerate
        run: ./scripts/generate.sh
      - name: Build the examples
        run: go vet ./... && go build ./...
      - name: Commit the regenerated client to main
        run: |
          if git diff --quiet; then
            echo "No change: the client already matches the published document." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "0xinsider-bot"
          git config user.email "support@0xinsider.com"
          git add -A
          git commit -m "Regenerate from the published OpenAPI document"
          git push origin HEAD:main
          {
            echo "Pushed $(git rev-parse HEAD) to main."
            echo
            echo '```'
            git show --stat --format=%s HEAD
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
