name: Regenerate from the published OpenAPI document

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Regenerate
        run: ./scripts/generate.sh
      - name: Open a pull request when the client changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No change."
            exit 0
          fi
          branch="regenerate/$(date -u +%Y-%m-%d)"
          git config user.name "0xinsider-bot"
          git config user.email "support@0xinsider.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "Regenerate from the published OpenAPI document"
          git push origin "$branch"
          gh pr create --title "Regenerate from the published OpenAPI document" \
            --body "The document at https://0xinsider.com/api/v1/openapi.json changed. Generated by scripts/generate.sh; review the diff and tag a release after merging."
